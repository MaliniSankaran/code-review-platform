version: '3.8'

services:
  postgres:
    container_name: crp-postgres
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: malini
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: codereview
      PGDATA: /data/postgres
    volumes:
      - postgres_data:/data/postgres
    ports:
      - "5432:5432"
    networks:
      - crp-network
    restart: unless-stopped

  app:
    container_name: crp-app
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_HOST: crp-postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_HOST: crp-minio
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "8080:8080"
    networks:
      - crp-network
    depends_on:
      - postgres
    restart: unless-stopped

  minio:
    container_name: crp-minio
    image: minio/minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - crp-network
    command: server /data --console-address ":9001"
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:

networks:
  crp-network:
    driver: bridge