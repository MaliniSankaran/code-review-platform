version: '3.8'

services:
  postgres:
    container_name: crp-postgres
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: malini
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: codereview
      PGDATA: /data/postgres
    volumes:
      - postgres_data:/data/postgres
    ports:
      - "5432:5432"
    networks:
      - crp-network
    restart: unless-stopped

  app:
    container_name: crp-app
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_HOST: crp-postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8080:8080"
    networks:
      - crp-network
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  crp-network:
    driver: bridge