version: '3.8'

services:
  postgres:
    container_name: crp-postgres
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: malini
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: codereview
      PGDATA: /data/postgres
    volumes:
      - postgres_data:/data/postgres
    ports:
      - "5432:5432"
    networks:
      - crp-network
    restart: unless-stopped

  minio:
    container_name: crp-minio
    image: minio/minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - crp-network
    command: server /data --console-address ":9001"
    restart: unless-stopped

  redis:
    container_name: crp-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - crp-network
    restart: unless-stopped

  auth-service:
    container_name: crp-auth
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    environment:
      DB_HOST: crp-postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8081:8081"
    networks:
      - crp-network
    depends_on:
      - postgres
    restart: unless-stopped

  file-service:
    container_name: crp-file
    build:
      context: .
      dockerfile: file-service/Dockerfile
    environment:
      DB_HOST: crp-postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MINIO_HOST: crp-minio
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      REDIS_HOST: crp-redis
      KAFKA_HOST: crp-kafka
    ports:
      - "8082:8082"
    networks:
      - crp-network
    depends_on:
      - postgres
      - redis
      - minio
      - kafka
    restart: unless-stopped

  review-service:
    container_name: crp-review
    build:
      context: .
      dockerfile: review-service/Dockerfile
    environment:
      DB_HOST: crp-postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MINIO_HOST: crp-minio
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      REDIS_HOST: crp-redis
    ports:
      - "8080:8080"
    networks:
      - crp-network
    depends_on:
      - postgres
      - redis
      - minio
    restart: unless-stopped

  gateway-service:
    container_name: crp-gateway
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    environment:
      AUTH_HOST: crp-auth
      FILE_HOST: crp-file
      REVIEW_HOST: crp-review
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8888:8888"
    networks:
      - crp-network
    depends_on:
      - auth-service
      - file-service
      - review-service
    restart: unless-stopped

  zookeeper:
    container_name: crp-zookeeper
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - crp-network
    restart: unless-stopped

  kafka:
    container_name: crp-kafka
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: crp-zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://crp-kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
    networks:
      - crp-network
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:

networks:
  crp-network:
    driver: bridge

