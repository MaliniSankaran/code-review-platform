version: '3.8'

services:
  postgres:
    container_name: crp-postgres
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: malini
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: codereview
      PGDATA: /data/postgres
    volumes:
      - postgres_data:/data/postgres
    ports:
      - "5432:5432"
    networks:
      - crp-network
    restart: unless-stopped

  minio:
    container_name: crp-minio
    image: minio/minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - crp-network
    command: server /data --console-address ":9001"
    restart: unless-stopped

  redis:
    container_name: crp-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - crp-network
    restart: unless-stopped

  auth-service:
    container_name: crp-auth
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    environment:
      DB_HOST: crp-postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8081:8081"
    networks:
      - crp-network
    depends_on:
      - postgres
    restart: unless-stopped

  file-service:
    container_name: crp-file
    build:
      context: .
      dockerfile: file-service/Dockerfile
    environment:
      DB_HOST: crp-postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MINIO_HOST: crp-minio
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      REDIS_HOST: crp-redis
    ports:
      - "8082:8082"
    networks:
      - crp-network
    depends_on:
      - postgres
      - redis
      - minio
    restart: unless-stopped

  review-service:
    container_name: crp-review
    build:
      context: .
      dockerfile: review-service/Dockerfile
    environment:
      DB_HOST: crp-postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MINIO_HOST: crp-minio
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      REDIS_HOST: crp-redis
    ports:
      - "8080:8080"
    networks:
      - crp-network
    depends_on:
      - postgres
      - redis
      - minio
    restart: unless-stopped

  gateway-service:
    container_name: crp-gateway
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    environment:
      AUTH_HOST: crp-auth
      FILE_HOST: crp-file
      REVIEW_HOST: crp-review
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8888:8888"
    networks:
      - crp-network
    depends_on:
      - auth-service
      - file-service
      - review-service
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:

networks:
  crp-network:
    driver: bridge