apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-service
  namespace: codereview
spec:
  replicas: 1
  selector:
    matchLabels:
      app: file-service
  template:
    metadata:
      labels:
        app: file-service
    spec:
      containers:
        - name: file-service
          image: code-review-platform-file-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: file-service
  namespace: codereview
spec:
  selector:
    app: file-service
  ports:
    - port: 8082
      targetPort: 8082
  type: ClusterIP