spring:
  application:
    name: code-review-platform

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/codereview
    username: malini
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      pool-name: CRPHikariPool

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:default-dev-secret-key-change-in-production-must-be-very-long-string}
  expiration: 86400000  # 24 hours in milliseconds

minio:
  url: http://${MINIO_HOST:localhost}:9000
  access-key: minioadmin
  secret-key: ${MINIO_ROOT_PASSWORD}
  bucket-name: code-files

