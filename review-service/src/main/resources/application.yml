spring:
  application:
    name: code-review-platform

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/codereview
    username: malini
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      pool-name: CRPHikariPool

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:${KAFKA_PORT:9092}
    consumer:
      group-id: review-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:default-dev-secret-key-change-in-production-must-be-very-long-string}
  expiration: 86400000  # 24 hours in milliseconds

minio:
  url: http://${MINIO_HOST:localhost}:9000
  access-key: minioadmin
  secret-key: ${MINIO_ROOT_PASSWORD}
  bucket-name: code-files

groq:
  api:
    key: ${GROQ_API_KEY}
    url: https://api.groq.com/openai/v1/chat/completions
    model: llama-3.3-70b-versatile

services:
  file-service:
    url: ${FILE_SERVICE_URL:http://localhost:8082}

ai:
  service:
    username: ${AI_SERVICE_USERNAME}
    password: ${AI_SERVICE_PASSWORD}
    auth-url: ${AUTH_SERVICE_URL:http://localhost:8081}/api/auth/login
