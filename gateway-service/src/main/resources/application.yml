spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:3000"
                  - "http://localhost:8888"
                  - "null"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true
                maxAge: 3600
          routes:
            - id: auth-service
              uri: http://${AUTH_HOST:localhost}:8081
              predicates:
                - Path=/api/auth/**

            - id: file-service
              uri: http://${FILE_HOST:localhost}:8082
              predicates:
                - Path=/api/repositories/**, /api/pulls/**

            - id: review-service
              uri: http://${REVIEW_HOST:localhost}:8080
              predicates:
                - Path=/api/analysis/**

            - id: file-service-ws
              uri: ws://${FILE_HOST:localhost}:8082
              predicates:
                - Path=/ws/**
              filters:
                - RewritePath=/ws/(?<segment>.*), /$\{segment}

server:
  port: 8888

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    com.codereview.gateway: INFO
    org.springframework.cloud.gateway: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}